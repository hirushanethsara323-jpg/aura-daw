# ============================================================================
# AURA DAW - CI
# SPDX-License-Identifier: GPL-3.0-or-later
#
# What CI has to prove (in priority order):
#   1. the Windows build works (Debug + Release, /W4 /WX) - it is the platform
#      that ships, and a green Linux build proves nothing about COM/WASAPI. The
#      MinGW cross-check job fails in a minute on the same code, so the slow
#      Windows runners are only asked to confirm, not to discover;
#   2. tests pass, including the static real-time-safety audit;
#   3. the engine still builds and tests with every optional dependency OFF;
#   4. static analysis is clean on the fast job;
#   5. sanitizers find nothing on the fast job;
#   6. the parsers survive a bounded libFuzzer run (and the soak harness survives
#      two minutes of continuous streaming);
#   7. the VST 3 configuration - the one that hosts third-party code - builds and
#      passes, in the `vst3` job. It is the only job that fetches the Steinberg SDK,
#      and it exists because a milestone whose flagship feature is only ever built on
#      a developer's machine is a milestone with an unverified feature.
#
# Runners have 2 cores: the build is -j 2 and the FetchContent directory is
# cached, otherwise the jobs spend their budget recompiling Catch2.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            build_type: Debug
            # Benchmarks are built in this row only: the memory-growth soak needs
            # the aura_soak harness, and it has no business inside the sanitizer
            # build (which is already the slowest job in the matrix).
            extra: "-DAURA_BUILD_BENCHMARKS=ON"
          - name: Debug+Sanitizers
            build_type: Debug
            extra: "-DAURA_ENABLE_SANITIZERS=ON"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-13
      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-${{ matrix.name }}-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DAURA_BUILD_TESTS=ON \
            -DAURA_WARNINGS_AS_ERRORS=ON \
            ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Real-time safety audit
        run: python3 tools/rt_audit.py . --list
      # Two minutes of continuous streaming: not a soak in its own right (the
      # 8-hour campaign is run on a workstation, see docs/PERFORMANCE.md), but
      # enough to catch a leak that grows by the megabyte per minute and enough to
      # keep the harness itself from rotting. The harness drives the real engine -
      # clips, inserts, a reverb aux bus, periodic graph rebuilds - as fast as the
      # null device allows, which at 256 frames and this CPU is roughly three
      # orders of magnitude more audio than real time.
      - name: Memory-growth soak (2 minutes)
        if: matrix.name == 'Debug'
        run: |
          ./build/bench/aura_soak --minutes 2 --tracks 8 --interval 15 \
            --max-growth-mb-per-hour 4 --workdir "$RUNNER_TEMP/aura-soak"
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux-${{ matrix.name }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml

  # VST 3 hosting (M6). The default build deliberately has no SDK, so this row is
  # the only place the adapter is compiled, linked and *run* against a real bundle:
  # the test fixture (tests/plugin/vst3) is built into a proper .vst3 bundle by the
  # build itself, and the suite loads it through the same code path a user's plug-in
  # takes. The last step scans that bundle with the helper binary and checks the
  # JSON, which is the half of the milestone that runs in a separate process.
  #
  # The same thing on Windows lives in the `windows` job as the "Debug-VST3" row:
  # the fixture is assembled in the Windows bundle layout now, so the product
  # platform hosts plug-ins in CI too.
  vst3:
    name: Linux VST 3 hosting
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-13
      # The Steinberg SDK is fetched at the pinned tag (38 MB, shallow, four
      # submodules). Caching the FetchContent tree is what keeps this job honest
      # about its budget on a 2-core runner.
      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build-vst3/_deps
          key: linux-vst3-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
      - name: Configure
        run: |
          cmake -S . -B build-vst3 -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DAURA_BUILD_TESTS=ON \
            -DAURA_WARNINGS_AS_ERRORS=ON \
            -DAURA_ENABLE_VST3=ON
      - name: Build
        run: cmake --build build-vst3 -j 2
      - name: Test
        run: ctest --test-dir build-vst3 --output-on-failure
      - name: The scanner helper really scans a real bundle
        run: |
          ./build-vst3/tools/aura_scan_host --version
          ./build-vst3/tools/aura_scan_host \
            --scan build-vst3/tests/vst3/AuraTestPlugin.vst3 --out "$RUNNER_TEMP/scan.json"
          python3 - <<'PYEOF'
          import json, os
          document = json.load(open(os.environ["RUNNER_TEMP"] + "/scan.json"))
          assert document["ok"], document
          assert document["classes"], document
          print("scanned:", document["classes"][0]["name"], document["classes"][0]["id"])
          PYEOF
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux-vst3
          path: |
            build-vst3/Testing/Temporary/LastTest.log
            build-vst3/CMakeFiles/CMakeConfigureLog.yaml

  # Fuzzing (issue #3). These are deliberately SHORT, bounded runs: the point is
  # that every push feeds hostile bytes to the parsers through a real libFuzzer
  # build (so a regression cannot hide behind "it only breaks under the fuzzer"),
  # not that CI replaces a fuzzing campaign. libFuzzer needs Clang for its runtime
  # and is skipped with a warning on any other compiler, which is why this job also
  # enables -DAURA_WARNINGS_AS_ERRORS=ON: the fuzz targets are the newest code in
  # the tree and the warnings they can produce are worth failing on.
  #
  # A longer campaign (and what to do with a crash) is documented in
  # docs/TESTING.md; the deterministic half of the same coverage - the property
  # that untrusted bytes produce an error and not a crash - runs as
  # aura_tests "[fuzz]" in the Linux and Windows jobs, so MSVC gets fuzzed too.
  fuzz:
    name: Fuzzing (clang + libFuzzer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DAURA_BUILD_TESTS=OFF \
            -DAURA_BUILD_BENCHMARKS=OFF \
            -DAURA_BUILD_FUZZERS=ON \
            -DAURA_WARNINGS_AS_ERRORS=ON \
            -DAURA_FUZZ_TMPDIR="$RUNNER_TEMP"
      - name: Build the fuzz targets
        run: cmake --build build-fuzz -j 2
      - name: Fuzz (bounded runs)
        run: |
          set -eu
          for target in aura_fuzz_json aura_fuzz_manifest aura_fuzz_wav; do
            corpus="fuzz/corpus/${target#aura_fuzz_}"
            echo "::group::$target"
            ./build-fuzz/fuzz/$target "$corpus" \
              -max_total_time=90 -timeout=10 -rss_limit_mb=1024 \
              -print_final_stats=1 -artifact_prefix="$RUNNER_TEMP/fuzz-"
            echo "::endgroup::"
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: |
            /tmp/fuzz-*
            build-fuzz/fuzz/*.log

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy-18 clang-18
      - name: Configure
        run: |
          cmake -S . -B build-tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Analyse the engine (warnings do not fail the job)
        run: cmake --build build-tidy -j 2 || true
      - name: Upload the compile database for local use
        uses: actions/upload-artifact@v4
        with:
          name: compile_commands
          path: build-tidy/compile_commands.json

  # Fast pre-flight for the Windows jobs: a MinGW-w64 cross compiler compiles every
  # Windows-only translation unit (and every public header standalone) on Linux.
  # It is not a supported build target - it is a type-and-warning check that runs
  # in about a minute, which the 15-minute Windows matrix should not be used for.
  windows-crosscheck:
    name: Windows cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Compile the Windows-only code as Windows
        run: bash tools/win_crosscheck.sh --require-toolchain --headers

  windows:
    name: Windows ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            build_type: Debug
            # Benchmarks are built in this row only: the memory-growth soak needs
            # the aura_soak harness, and it has no business inside the sanitizer
            # build (which is already the slowest job in the matrix).
            extra: "-DAURA_BUILD_BENCHMARKS=ON"
          - name: Release
            build_type: Release
            extra: ""
          # Proves that "optional" dependencies really are optional: no network
          # fetch, no ASIO, no VST3, no JUCE. The Catch2 source path is appended in
          # the configure step - a relative "../catch2" that tests/CMakeLists.txt
          # resolves against the repository root.
          - name: Release-no-deps
            build_type: Release
            extra: "-DAURA_FETCH_DEPS=OFF"
          # MSVC's address sanitizer (M5's last acceptance item). Its own row rather
          # than a flag on the Debug row: it builds with the dynamic CRT and without
          # /RTC1, so it is a different configuration, and a failure in it has to be
          # legible next to the two rows that must keep passing.
          - name: Debug-ASan
            build_type: Debug
            extra: "-DAURA_ENABLE_SANITIZERS=ON"
            asan: "ON"
          # VST 3 on the platform that ships (M6). The Linux row proves the adapter
          # against the format; this one proves the same code compiles under MSVC and
          # that a real Windows bundle (Contents/x86_64-win/<name>.vst3) loads,
          # processes and restores state. It is its own row so a failure here reads as
          # "the plug-in host broke", not "the build broke".
          - name: Debug-VST3
            build_type: Debug
            extra: "-DAURA_ENABLE_VST3=ON"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Catch2 once (for the no-deps job)
        if: matrix.name == 'Release-no-deps'
        shell: bash
        run: git clone --branch v3.7.1 --depth 1 https://github.com/catchorg/Catch2.git "${{ github.workspace }}/../catch2"

      - name: Cache FetchContent
        if: matrix.name != 'Release-no-deps'
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: windows-${{ matrix.name }}-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Configure
        shell: bash
        run: |
          extra="${{ matrix.extra }}"
          if [[ "$extra" == *"AURA_FETCH_DEPS=OFF"* ]]; then
            # Relative to the repository root, so no shell path computation is
            # involved (a Windows runner would otherwise hand CMake an MSYS path).
            extra="$extra -DAURA_CATCH2_DIR=../catch2"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DAURA_BUILD_TESTS=ON \
            -DAURA_WARNINGS_AS_ERRORS=ON \
            $extra

      - name: Put the MSVC sanitizer runtime on PATH
        # MSVC's ASan runtime is a DLL that lives beside the compiler, not beside the
        # test binaries, and nothing copies it there for you: without this the test
        # step would fail to start the process at all, which looks like a broken build
        # rather than a missing deployment step.
        if: matrix.asan == 'ON'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dll = Get-ChildItem -Path (Join-Path $vs 'VC\Tools\MSVC') -Recurse `
                   -Filter clang_rt.asan_dynamic-x86_64.dll | Select-Object -First 1
          if (-not $dll) { throw "ASan runtime not found under $vs" }
          Write-Host "Sanitizer runtime: $($dll.FullName)"
          $dll.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j 2

      - name: Test
        shell: bash
        env:
          # halt_on_error makes the first finding fail the run immediately instead of
          # printing a report and continuing to the next test, and the symbolizer
          # turns the stack into file:line for code built with /Zi.
          ASAN_OPTIONS: ${{ matrix.asan == 'ON' && 'halt_on_error=1:detect_leaks=0:print_summary=1' || '' }}
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-${{ matrix.name }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml

  # One job that only checks the documentation claims that are cheap to verify:
  # every research document is referenced by the index, and the licence headers
  # are on every source file.
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Every source file has the SPDX header
        run: |
          missing=0
          while IFS= read -r f; do
            if ! head -n 12 "$f" | grep -q "SPDX-License-Identifier: GPL-3.0-or-later"; then
              echo "missing SPDX header: $f"; missing=1
            fi
          # fuzz/ is part of this scan on purpose: it is the newest source
          # directory and the one a contributor is most likely to copy a file
          # into without the header.
          done < <(find include src tests tools bench fuzz scripts -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.py' -o -name '*.sh' \) 2>/dev/null)
          exit $missing
      - name: Research documents are listed in the index
        run: |
          status=0
          for f in docs/research/*.md; do
            base=$(basename "$f")
            [ "$base" = "README.md" ] && continue
            if ! grep -q "$base" docs/research/README.md; then
              echo "not listed in docs/research/README.md: $base"; status=1
            fi
          done
          exit $status
